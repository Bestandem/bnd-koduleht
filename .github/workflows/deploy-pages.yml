name: Avalda testversioon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Laadi lähtekood
        uses: actions/checkout@v4
      - name: Seadista GitHub Pages
        uses: actions/configure-pages@v5
      - name: Paki testversioon
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Avalda
        id: deployment
        uses: actions/deploy-pages@v4

